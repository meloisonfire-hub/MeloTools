server {
    listen 80;
    listen [::]:80;
    server_name melotools.com.br www.melotools.com.br;
    return 301 https://melotools.com.br$request_uri;
}

# Legacy hostname kept isolated from the MeloTools virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name kkkkkkkkkk.com.br;
    return 404;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name melotools.com.br www.melotools.com.br;

    ssl_certificate /etc/letsencrypt/live/melotools.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melotools.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 250m;
    client_body_timeout 120;
    send_timeout 900;
    limit_conn melotools_connections 20;
    limit_req zone=melotools_general burst=30 nodelay;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # Flask also sets these for direct/local responses; expose a single canonical
    # copy at the TLS edge instead of forwarding duplicates from the upstream.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Frame-Options;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; worker-src 'self' blob:;" always;

    location /static/ {
        alias /srv/melotools/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Preserve the historical prefix aliases used by older integrations.
    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    location /execucoes/ {
        rewrite ^/execucoes/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    location ~ ^/api/(online|image|documents|videos)/ {
        limit_req zone=melotools_heavy burst=4 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }
}
