name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libzbar0 poppler-utils tesseract-ocr
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app.py melotools tools
      - name: Lint Python
        run: python -m ruff check app.py melotools tools tests test_all_functions.py
      - name: Check text encoding
        run: python tools/check_text_encoding.py
      - name: Validate browser assets
        run: |
          node --check static/js/i18n.js
          node --check static/js/melotools-extra-tabs.js
          node --check static/js/tool-shortcuts.js
          node --check static/sw.js
          node -e "JSON.parse(require('fs').readFileSync('static/manifest.json', 'utf8'))"
      - name: Test
        env:
          MELOTOOLS_SECRET_KEY: ci-only-secret
        shell: bash
        run: |
          set +e
          python -m pytest -vv 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          {
            echo '### pytest output'
            echo '```text'
            cat pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
